<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Factory</title>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --ink:#1d1d1b; --mute:#6b6b66; --line:#e3e2dc;
          --pass:#1f7a4d; --chg:#b4541a; --pend:#9a9a93; --hum:#b3261e; --acc:#2c5bd6; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
          --bg:#141413; --panel:#1e1e1c; --ink:#ecebe6; --mute:#9d9c95; --line:#33322f;
          --pass:#5cc08d; --chg:#e9925a; --pend:#77766f; --hum:#ff7a70; --acc:#7da2ff; } }
  * { box-sizing:border-box }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--ink) }
  header { display:flex; gap:16px; align-items:center; padding:16px; border-bottom:1px solid var(--line); flex-wrap:wrap }
  h1 { font-size:18px; margin:0 } .mute { color:var(--mute) }
  .board { display:grid; grid-template-columns:repeat(6,minmax(180px,1fr)); gap:12px; padding:16px; overflow-x:auto }
  @media (max-width:760px){ .board{ grid-template-columns:1fr } }
  .col h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); margin:0 0 8px }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:8px; cursor:pointer }
  .card.human { border-color:var(--hum); box-shadow:inset 3px 0 0 var(--hum) }
  .card b { display:block; font-size:13px; word-break:break-word }
  .meta { font-size:12px; color:var(--mute); margin-top:4px }
  .chips { display:flex; gap:4px; flex-wrap:wrap; margin-top:6px }
  .chip { font-size:11px; padding:1px 6px; border-radius:999px; border:1px solid currentColor }
  .chip.state { color:var(--panel); background:var(--ink); border-color:var(--ink); font-weight:650 }
  .chip.source { color:var(--acc) } .chip.stage { color:var(--mute) }
  .PASS { color:var(--pass) } .CHANGES { color:var(--chg) } .pending { color:var(--pend) } .skipped { color:var(--pend); opacity:.5 }
  dialog { width:min(900px,96vw); max-height:90vh; border:1px solid var(--line); border-radius:10px; background:var(--panel); color:var(--ink); padding:0 }
  dialog header { position:sticky; top:0; background:var(--panel) }
  .files { display:flex; gap:6px; flex-wrap:wrap; padding:8px 16px }
  .files button { font:inherit; font-size:12px; border:1px solid var(--line); background:transparent; color:var(--acc); border-radius:6px; padding:2px 8px; cursor:pointer }
  pre { white-space:pre-wrap; padding:0 16px 16px; margin:0; font:12.5px/1.5 ui-monospace,Menlo,monospace }
  a { color:var(--acc) }
  details { padding:10px 16px; border-bottom:1px solid var(--line) }
  details ul { margin-bottom:0 }
  button.card { width:100%; display:block; text-align:left; font:inherit; color:inherit }
  .description { display:block; margin-top:7px; color:var(--ink); font-size:12px; line-height:1.4 }
  .nav { margin-left:auto; display:flex; gap:10px; align-items:center; font-size:12px }
  .surfaces { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:8px; padding:12px 16px; border-bottom:1px solid var(--line) }
  .surface { display:block; border:1px solid var(--line); border-radius:8px; padding:10px; text-decoration:none; color:var(--ink); background:var(--panel) }
  .surface b { display:block; font-size:12px; color:var(--acc) }.surface span { display:block; color:var(--mute); font-size:11px; margin-top:3px }
  .network { padding:0 16px 16px }.network iframe { width:100%; height:min(68vh,720px); border:1px solid var(--line); border-radius:8px; background:var(--panel) }
</style>
</head>
<body>
<header>
  <h1>Product Factory</h1>
  <span class="mute" id="summary">loading…</span>
  <span class="chip state" id="state">Loading state</span>
  <label>Module <select id="module"><option value="">All modules</option></select></label>
  <nav class="nav"><a href="atlas.html">Atlas</a><a href="graphify/workspace-view.html" target="_blank" rel="noopener">Code network</a></nav>
</header>
<details><summary id="queueSummary">Backlog</summary><ul id="queue"></ul></details>
<section class="surfaces" id="surfaces" aria-label="Factory surfaces"></section>
<details class="network"><summary>Live workspace code network</summary><iframe src="graphify/workspace-view.html" title="Live workspace code network"></iframe></details>
<main class="board" id="board"></main>
<dialog id="dlg"><header><b id="dlgTitle"></b><button onclick="dlg.close()">Close</button></header>
  <div class="files" id="dlgFiles"></div><pre id="dlgBody"></pre></dialog>
<script>
const COLS = [
  ["Product", ["triage","discovery","spec","design","repro"]],
  ["Plan", ["plan"]],
  ["Build", ["build"]],
  ["Review & QA", ["review","qa","release"]],
  ["Gate / PR", ["gate","pr-open"]],
  ["Human & done", ["needs-human","done","closed"]],
];
const KNOWN = ["triage.md","discovery.md","spec.md","repro.md","design.md","plan.md","build.md","qa.md","gate.md","pr.md","release.md","retro.md"];
const moduleFilter = document.getElementById("module");
const queue = document.getElementById("queue");
let loadedJobs = [];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const issueUrl = j => String(j.source || "").startsWith("issue:") ? String(j.source).slice(6) : "";
const short = (s, n=180) => { s = String(s || "").trim(); return s.length > n ? s.slice(0, n - 1) + "…" : s; };

async function listDir(path) {
  const r = await fetch(path, {cache:"no-store"}); if (!r.ok) return [];
  const html = await r.text();
  return [...html.matchAll(/href="([^"?#]+)"/g)].map(m => decodeURIComponent(m[1])).filter(h => !h.startsWith("/") && !h.startsWith(".."));
}
async function load() {
  const ids = (await listDir("jobs/")).filter(h => h.endsWith("/")).map(h => h.slice(0,-1));
  const jobs = (await Promise.all(ids.map(id => fetch(`jobs/${id}/job.json`, {cache:"no-store"})
      .then(r => r.ok ? r.json() : null).catch(() => null)))).filter(Boolean);
  await Promise.all(jobs.filter(j => j.stage === "review").flatMap(j =>
    Object.entries(j.reviews || {}).filter(([, value]) => value === "pending").map(async ([lens]) => {
      const file = `jobs/${j.id}/round-${j.round}/review-${lens}.md`;
      const body = await fetch(file, {cache:"no-store"}).then(r => r.ok ? r.text() : "").catch(() => "");
      const verdict = body.split(/\r?\n/, 1)[0];
      if (verdict === "VERDICT: PASS" || verdict === "VERDICT: CHANGES") {
        j.reviews[lens] = verdict.slice(9);
      }
    })
  ));
  loadedJobs = jobs;
  const atlas = await fetch("atlas.json", {cache:"no-store"}).then(r => r.ok ? r.json() : {}).catch(() => ({}));
  renderSurfaces(atlas.dashboards || []);
  const selected = moduleFilter.value;
  const areas = [...new Set(jobs.map(j => j.area || j.module).filter(Boolean))].sort();
  moduleFilter.replaceChildren(new Option("All modules", ""), ...areas.map(a => new Option(a, a)));
  moduleFilter.value = areas.includes(selected) ? selected : "";
  render(jobs);
  const backlog = await fetch("backlog.md", {cache:"no-store"}).then(r => r.ok ? r.text() : "").catch(() => "");
  const items = backlog.split(/\r?\n/).filter(line => line.startsWith("- [ ] ")).map(line => line.slice(6));
  document.getElementById("queueSummary").textContent = `Backlog · ${items.length} queued`;
  queue.replaceChildren(...items.map(item => {
    const entry = document.createElement("li"); entry.textContent = item; return entry;
  }));
}
function renderSurfaces(entries) {
  const host = document.getElementById("surfaces"); host.replaceChildren();
  for (const item of entries) {
    const href = String(item.href || "");
    if (!href || (!/^https?:\/\//i.test(href) && href.includes(".."))) continue;
    const a = document.createElement("a"); a.className = "surface"; a.href = href;
    if (/^https?:\/\//i.test(href)) { a.target = "_blank"; a.rel = "noopener"; }
    a.innerHTML = `<b>${esc(item.label || "Surface")}</b><span>${esc(item.description || "Open live view")}</span>`;
    host.appendChild(a);
  }
}
moduleFilter.addEventListener("change", () => render(loadedJobs));
function render(jobs) {
  const board = document.getElementById("board"); board.innerHTML = "";
  const selected = moduleFilter.value;
  if (selected) jobs = jobs.filter(j => (j.area || j.module) === selected);
  const human = jobs.filter(j => j.stage === "needs-human").length;
  document.getElementById("summary").textContent =
    `${jobs.length} jobs · ${jobs.filter(j=>!["done","closed","needs-human","pr-open"].includes(j.stage)).length} active · ${human} need you`;
  const active = jobs.filter(j=>!["done","closed","needs-human","pr-open"].includes(j.stage)).length;
  document.getElementById("state").textContent = active ? `Factory active · ${active} running` : jobs.length ? "Factory waiting for review" : "Factory ready · no work started";
  for (const [title, stages] of COLS) {
    const col = document.createElement("section"); col.className = "col";
    col.innerHTML = `<h2>${title}</h2>`;
    for (const j of jobs.filter(j => stages.includes(j.stage)).sort((a,b)=>a.id.localeCompare(b.id))) {
      const c = document.createElement("button"); c.type = "button"; c.className = "card" + (j.stage==="needs-human" ? " human" : "");
      const chips = [
        `<span class="chip source">${issueUrl(j) ? "Issue" : esc(j.source || "Manual")}</span>`,
        `<span class="chip stage">Stage: ${esc(j.stage)}</span>`,
        ...Object.entries(j.reviews||{}).map(([k,v]) => `<span class="chip ${esc(v)}">${esc(k)}: ${esc(v)}</span>`)
      ].join("");
      c.innerHTML = `<b>${esc(j.id)}</b><span class="meta">${[j.area || j.module, j.type, j.stage, j.round && `r${j.round}`].filter(Boolean).map(esc).join(" · ")}</span>
        <span class="description">${esc(short(j.request || j.reason || "No description recorded yet."))}</span>
        <span class="chips">${chips}</span>${j.reason ? `<span class="meta">Blocked: ${esc(j.reason)}</span>` : ""}`;
      c.onclick = () => openJob(j); col.appendChild(c);
    }
    board.appendChild(col);
  }
}
async function openJob(j) {
  dlgTitle.textContent = `${j.id} — ${j.request||""}`;
  const top = await listDir(`jobs/${j.id}/`);
  const rounds = top.filter(h => /^round-\d+\/$/.test(h));
  let files = KNOWN.filter(f => top.includes(f)).concat(top.filter(f => /^rework-\d+\.md$/.test(f)));
  for (const r of rounds) files = files.concat((await listDir(`jobs/${j.id}/${r}`)).filter(f=>f.endsWith(".md")).map(f => r + f));
  files.push("job.json");
  dlgFiles.innerHTML = "";
  const issue = issueUrl(j);
  if (issue && /^https:\/\//.test(issue)) {
    const link = document.createElement("a"); link.href = issue; link.textContent = "Open issue";
    link.target = "_blank"; link.rel = "noopener"; dlgFiles.appendChild(link);
  }
  if (typeof j.pr === "string" && /^https:\/\//.test(j.pr)) {
    const link = document.createElement("a"); link.href = j.pr; link.textContent = "Pull request";
    link.target = "_blank"; link.rel = "noopener"; dlgFiles.appendChild(link);
  }
  const request = document.createElement("button"); request.textContent = "Description";
  request.onclick = () => { dlgBody.textContent = j.request || j.reason || "No description recorded yet."; };
  dlgFiles.appendChild(request);
  files.forEach(f => { const b = document.createElement("button"); b.textContent = f; b.onclick = () => show(j.id, f); dlgFiles.appendChild(b); });
  show(j.id, files[0]); dlg.showModal();
}
async function show(id, f) { const r = await fetch(`jobs/${id}/${f}`, {cache:"no-store"}); dlgBody.textContent = r.ok ? await r.text() : "(missing)"; }
load(); setInterval(load, 3000);
</script>
</body>
</html>
