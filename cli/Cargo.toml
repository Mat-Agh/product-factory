[package]
name = "pf"
version = "0.2.0"
edition = "2024"
description = "Product Factory CLI: guard hook, docs map, diagrams, install, doctor, mirror, export"
license = "UNLICENSED"
publish = false

[[bin]]
name = "pf"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
shlex = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
