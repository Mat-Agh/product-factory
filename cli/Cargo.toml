[package]
name = "pf"
version = "1.3.0"
edition = "2024"
rust-version = "1.89"
description = "Product Factory CLI: guard hook, docs map, diagrams, install, doctor, mirror, export"
license = "UNLICENSED"
publish = false

[[bin]]
name = "pf"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
shlex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
