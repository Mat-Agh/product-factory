<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product Factory code graph</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#0c1220;color:#e5eaf4;font:14px system-ui}
  header{height:64px;display:flex;align-items:center;gap:14px;padding:12px 18px;background:#151e30;border-bottom:1px solid #34415b}
  h1{font-size:17px;margin:0;white-space:nowrap}input{width:min(390px,40vw);padding:9px 12px;background:#0c1220;color:#fff;border:1px solid #50617e;border-radius:8px}button{padding:9px 12px;background:#233655;color:#e5eaf4;border:1px solid #50617e;border-radius:8px;cursor:pointer}button:hover{background:#355278}
  main{display:grid;grid-template-columns:minmax(0,1fr) 320px;height:calc(100vh - 64px)}canvas{width:100%;height:100%;cursor:grab}canvas:active{cursor:grabbing}
  aside{padding:18px;overflow:auto;border-left:1px solid #34415b;background:#10192b}aside h2{font-size:15px;margin:0 0 12px}aside p{line-height:1.45;color:#aebbd1}
  .row{padding:8px 0;border-bottom:1px solid #2c394e;cursor:pointer;overflow-wrap:anywhere}.row:hover{color:#77d5ff}small{color:#8fa2be}
  @media(max-width:760px){main{grid-template-columns:1fr;grid-template-rows:65vh auto}aside{border-left:0;border-top:1px solid #34415b}header{flex-wrap:wrap;height:auto}main{height:auto}}
</style>
<header><h1>Code network</h1><input id="search" placeholder="Find a file, function, class, or symbol" aria-label="Search code graph"><button id="mode" aria-label="Switch graph layout">Brain cloud</button><span id="count"></span></header>
<main><canvas id="view" aria-label="Rotatable three dimensional code network"></canvas><aside><h2 id="heading">Explore the code</h2><p id="details">Drag to rotate, scroll to zoom, or select a file. Search includes Graphify's code symbols and source locations. The graph is local to this checkout.</p><div id="results"></div></aside></main>
<script id="graph-data" type="application/json">__GRAPH_JSON__</script>
<script>
const graph=JSON.parse(document.getElementById('graph-data').textContent);
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d');
const search=document.getElementById('search'),results=document.getElementById('results');
const heading=document.getElementById('heading'),details=document.getElementById('details');
const byId=new Map(graph.nodes.map(n=>[n.id,n]));
const files=new Map(),edges=new Map();
for(const n of graph.nodes){if(!n.source_file)continue;let f=files.get(n.source_file);if(!f){f={name:n.source_file,symbols:[],degree:0};files.set(n.source_file,f)}f.symbols.push(n)}
for(const e of graph.links){const a=byId.get(e.source)?.source_file,b=byId.get(e.target)?.source_file;if(!a||!b||a===b||!files.has(a)||!files.has(b))continue;const key=a<b?a+'\n'+b:b+'\n'+a;edges.set(key,(edges.get(key)||0)+1);files.get(a).degree++;files.get(b).degree++}
let selected=null,angleX=.25,angleY=.1,zoom=1,drag=false,lastX=0,lastY=0,layoutMode='brain';
const ranked=[...files.values()].sort((a,b)=>b.degree-a.degree);
const color=(name)=>{let h=0;for(const c of name.slice(0,60))h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 78% 68%)`};
const hash=(s)=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0};
const rnd=(seed)=>{seed=Math.imul(seed^seed>>>16,2246822507);seed=Math.imul(seed^seed>>>13,3266489909);return ((seed^seed>>>16)>>>0)/4294967295};
const group=(name)=>{const p=name.split('/');return p[0]==='application'&&p.length>1?p[1]:p[0]};
function setSelected(f){selected=f;heading.textContent=f.name.split('/').pop();details.textContent=f.name+' · '+f.symbols.length+' symbols · '+f.degree+' cross-file references';results.replaceChildren();for(const n of f.symbols.slice(0,120)){const row=document.createElement('div');row.className='row';row.textContent=n.label||n.id;const loc=document.createElement('small');loc.textContent=' '+(n.source_location||'');row.append(loc);results.append(row)}draw()}
function visible(){const q=search.value.trim().toLowerCase();if(!q)return ranked.slice(0,400);const hits=ranked.filter(f=>f.name.toLowerCase().includes(q)||f.symbols.some(n=>(n.label||'').toLowerCase().includes(q)));return hits.slice(0,400)}
function layout(nodes){const N=nodes.length;if(layoutMode==='sphere')return nodes.map((f,i)=>{const k=i+.5,z=1-2*k/N,r=Math.sqrt(1-z*z),t=Math.PI*(3-Math.sqrt(5))*i;return {...f,x:Math.cos(t)*r,y:Math.sin(t)*r,z}});
 const groups=[...new Set(nodes.map(f=>group(f.name)))].sort();const centers=new Map(groups.map((g,i)=>{const a=2*Math.PI*(i+.5)/groups.length,h=i%2?1:-1;return [g,{x:h*(.28+.32*rnd(hash(g))),y:Math.sin(a)*.52,z:Math.cos(a)*.48}]}));
 return nodes.map(f=>{const seed=hash(f.name),c=centers.get(group(f.name));const a=2*Math.PI*rnd(seed),b=2*Math.PI*rnd(seed+17),r=.10+.36*Math.sqrt(rnd(seed+31));return {...f,x:c.x+Math.cos(a)*Math.sin(b)*r,y:c.y+Math.sin(a)*Math.sin(b)*r,z:c.z+Math.cos(b)*r*.8}})}
function project(n,w,h){const cy=Math.cos(angleY),sy=Math.sin(angleY),cx=Math.cos(angleX),sx=Math.sin(angleX);const x=n.x*cy-n.z*sy,z=n.x*sy+n.z*cy,y=n.y*cx-z*sx,d=n.y*sx+z*cx;const perspective=1/(2.3-d);return {x:w/2+x*perspective*zoom*Math.min(w,h)*.9,y:h/2+y*perspective*zoom*Math.min(w,h)*.9,r:Math.max(2,Math.min(9,2.5+Math.log1p(n.degree)*.8))*perspective*1.5,d}}
let plotted=[];
function draw(){const ratio=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*ratio;canvas.height=h*ratio;ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,w,h);const nodes=layout(visible());document.getElementById('count').textContent=`${files.size} files · ${graph.nodes.length} symbols · ${graph.links.length} links`;
 if(layoutMode==='brain'){for(const n of nodes.filter((_,i)=>i%5===0)){const p=project(n,w,h),glow=ctx.createRadialGradient(p.x,p.y,2,p.x,p.y,65*zoom);glow.addColorStop(0,'#5279d122');glow.addColorStop(1,'#5279d100');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(p.x,p.y,65*zoom,0,Math.PI*2);ctx.fill()}}
 const map=new Map(nodes.map(n=>[n.name,n]));plotted=nodes.map(n=>({file:n,p:project(n,w,h)}));ctx.lineWidth=.6;ctx.strokeStyle='#45608077';let drawn=0;for(const key of edges.keys()){if(drawn>1800)break;const [a,b]=key.split('\n');if(!map.has(a)||!map.has(b))continue;const p=project(map.get(a),w,h),q=project(map.get(b),w,h);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();drawn++}
 for(const {file,p} of plotted.sort((a,b)=>a.p.d-b.p.d)){ctx.beginPath();ctx.arc(p.x,p.y,file.name===selected?.name?p.r+3:p.r,0,Math.PI*2);ctx.fillStyle=color(file.name);ctx.fill();if(file.name===selected?.name){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}}
}
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;angleY+=(e.clientX-lastX)*.006;angleX+=(e.clientY-lastY)*.006;lastX=e.clientX;lastY=e.clientY;draw()});
canvas.addEventListener('pointerup',e=>{drag=false;canvas.releasePointerCapture(e.pointerId)});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.35,Math.min(4,zoom*(e.deltaY>0?.9:1.1)));draw()},{passive:false});
canvas.addEventListener('click',e=>{const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;const hit=plotted.map(o=>({o,d:(o.p.x-x)**2+(o.p.y-y)**2})).sort((a,b)=>a.d-b.d)[0];if(hit&&hit.d<240)setSelected(hit.o.file)});
search.addEventListener('input',()=>{const hits=visible();results.replaceChildren();heading.textContent=search.value?'Search results':'Explore the code';details.textContent=search.value?`${hits.length} matching files (up to 400 shown)`: 'Drag to rotate, scroll to zoom, or select a file.';for(const f of hits.slice(0,30)){const row=document.createElement('div');row.className='row';row.textContent=f.name;row.onclick=()=>setSelected(f);results.append(row)}draw()});
document.getElementById('mode').addEventListener('click',()=>{layoutMode=layoutMode==='brain'?'sphere':'brain';document.getElementById('mode').textContent=layoutMode==='brain'?'Brain cloud':'Thought sphere';draw()});
addEventListener('resize',draw);draw();
</script>
</html>
