<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product Factory code network</title>
<style>
:root{color-scheme:dark;--bg:#090f1d;--panel:#111c2e;--line:#31445f;--text:#e8effa;--muted:#a8b9d0;--accent:#7bd6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}
header{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:11px 16px;background:#141f32;border-bottom:1px solid var(--line)}h1{font-size:17px;margin:0 8px 0 0}input,button{font:inherit}input[type=search]{width:min(390px,36vw);min-width:210px;padding:9px 12px;background:#0a1424;color:var(--text);border:1px solid #4b6181;border-radius:8px}button{padding:8px 11px;background:#223753;color:var(--text);border:1px solid #4b6181;border-radius:8px;cursor:pointer}button:hover,button:focus-visible{background:#34567b;outline:1px solid var(--accent)}button[aria-pressed=true]{background:#28546d;border-color:var(--accent)}#count{color:var(--muted);font-size:12px;margin-left:auto}#controls{display:flex;gap:6px;align-items:center}#zoom{width:95px;accent-color:var(--accent)}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,370px);height:calc(100vh - 64px)}#stage{position:relative;overflow:hidden}canvas{width:100%;height:100%;cursor:grab;touch-action:none}canvas:active{cursor:grabbing}#hint{position:absolute;left:14px;bottom:12px;padding:7px 10px;background:#0c1725d9;border:1px solid #3b516d;border-radius:8px;color:var(--muted);font-size:12px;pointer-events:none}#hover{position:absolute;display:none;max-width:340px;padding:7px 10px;background:#182b45ec;border:1px solid var(--accent);border-radius:7px;pointer-events:none;overflow-wrap:anywhere}
aside{padding:18px;overflow:auto;border-left:1px solid var(--line);background:var(--panel)}aside h2{font-size:16px;margin:0 0 8px;overflow-wrap:anywhere}aside h3{font-size:13px;margin:18px 0 8px;color:var(--accent)}aside p{line-height:1.5;color:var(--muted);overflow-wrap:anywhere}small{color:var(--muted)}.row{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid #2b3b52;border-radius:0;padding:7px 1px;color:var(--text);overflow-wrap:anywhere}.row:hover{color:var(--accent);background:#1e3148}.meta{font-size:12px;color:var(--muted)}.path{font:12px ui-monospace,SFMono-Regular,monospace;color:#c1d5eb;overflow-wrap:anywhere}.badge{display:inline-block;margin:2px 4px 2px 0;padding:3px 6px;border-radius:5px;background:#273d59;color:#cfe5f7;font-size:11px}.empty{color:var(--muted)}
pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:10px;background:#091523;border:1px solid #31445f;border-radius:8px;color:#c5daee;font:11px/1.5 ui-monospace,SFMono-Regular,monospace}
@media(max-width:800px){header{height:auto}main{grid-template-columns:1fr;grid-template-rows:58vh minmax(320px,auto);height:auto}aside{border-left:0;border-top:1px solid var(--line);max-height:60vh}input[type=search]{width:100%}#count{margin-left:0}}
</style>
<header><h1>Code network</h1><input id="search" type="search" placeholder="Find a file, class, function, or symbol" aria-label="Search code network"><button id="mode" aria-label="Switch layout">Brain cloud</button><button id="focus" aria-pressed="false" title="Show selected node and neighbors">Focus</button><div id="controls"><button id="zoom-out" aria-label="Zoom out">−</button><input id="zoom" type="range" min="0.4" max="4" step="0.1" value="1" aria-label="Zoom level"><button id="zoom-in" aria-label="Zoom in">+</button><button id="reset" title="Reset rotation, pan, and zoom">Reset</button></div><span id="count"></span></header>
<main><div id="stage"><canvas id="view" tabindex="0" aria-label="Interactive three dimensional code network"></canvas><div id="hover"></div><div id="hint">Drag to rotate · Shift+drag to pan · Scroll to zoom · Click a node to inspect</div></div><aside><h2 id="heading">Explore the code</h2><div id="details"><p>Select a node or search for a file or symbol. Relationships come from Graphify's extracted code index; repository hub links show workspace membership.</p></div><div id="results"></div></aside></main>
<script id="graph-data" type="application/json">__GRAPH_JSON__</script>
<script>
'use strict';
const graph=JSON.parse(document.getElementById('graph-data').textContent);
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),search=document.getElementById('search');
const details=document.getElementById('details'),results=document.getElementById('results'),heading=document.getElementById('heading'),hover=document.getElementById('hover');
const nodeById=new Map(graph.nodes.map(n=>[n.id,n])),files=new Map(),symbolById=new Map();
const fileOut=new Map(),fileIn=new Map(),symbolOut=new Map(),symbolIn=new Map(),edges=new Map();
const add=(map,key,value)=>{if(!map.has(key))map.set(key,[]);map.get(key).push(value)};
for(const n of graph.nodes){if(!n.source_file)continue;let f=files.get(n.source_file);if(!f){f={name:n.source_file,symbols:[],degree:0};files.set(n.source_file,f)}for(const s of Array.isArray(n.symbols)?n.symbols:[n]){f.symbols.push(s);if(s.id)symbolById.set(s.id,{...s,file:f.name})}}
for(const e of graph.links){const a=nodeById.get(e.source)?.source_file,b=nodeById.get(e.target)?.source_file;if(!a||!b||a===b||!files.has(a)||!files.has(b))continue;const relation=e.relation||'references',count=e.count||1,hierarchy=a==='@workspace'||b==='@workspace'||a.endsWith('/@module')||b.endsWith('/@module');add(fileOut,a,{name:b,relation,count,hierarchy});add(fileIn,b,{name:a,relation,count,hierarchy});const key=a<b?a+'\n'+b:b+'\n'+a;const prior=edges.get(key);if(prior){prior.count+=count;prior.hierarchy||=hierarchy}else edges.set(key,{a,b,count,hierarchy});files.get(a).degree+=count;files.get(b).degree+=count}
for(const e of graph.symbol_links||graph.links){if(!symbolById.has(e.source)||!symbolById.has(e.target))continue;add(symbolOut,e.source,{id:e.target,relation:e.relation||'references'});add(symbolIn,e.target,{id:e.source,relation:e.relation||'references'})}
const ranked=[...files.values()].sort((a,b)=>b.degree-a.degree),hubs=ranked.filter(f=>f.name==='@workspace'||f.name.endsWith('/@module'));
let selected=null,selectedSymbol=null,angleX=.25,angleY=.1,zoom=1,panX=0,panY=0,layoutMode='brain',focusMode=false,drag=false,moved=false,lastX=0,lastY=0,plotted=[];
const make=(tag,cls,value)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(value!==undefined)el.textContent=value;return el};
const color=name=>{let h=0;for(const c of name.slice(0,60))h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 80% 69%)`};
const hash=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0};
const rnd=seed=>{seed=Math.imul(seed^seed>>>16,2246822507);seed=Math.imul(seed^seed>>>13,3266489909);return ((seed^seed>>>16)>>>0)/4294967295};
const group=name=>{const p=name.split('/');return p[0]==='application'&&p.length>1?p[1]:p[0]};
const related=f=>new Set([f.name,...(fileOut.get(f.name)||[]).map(x=>x.name),...(fileIn.get(f.name)||[]).map(x=>x.name)]);
function visible(){const q=search.value.trim().toLowerCase();if(focusMode&&selected){const names=related(selected);return ranked.filter(f=>names.has(f.name)).slice(0,400)}if(q){const hits=ranked.filter(f=>f.name.toLowerCase().includes(q)||f.symbols.some(s=>(s.label||'').toLowerCase().includes(q)));return hits.slice(0,400)}const main=ranked.filter(f=>!hubs.includes(f)).slice(0,400-hubs.length);if(selected&&!main.includes(selected)&&!hubs.includes(selected))main.pop(),main.push(selected);return [...hubs,...main]}
function layout(nodes){const N=nodes.length;if(layoutMode==='sphere')return nodes.map((f,i)=>{const k=i+.5,z=1-2*k/N,r=Math.sqrt(1-z*z),t=Math.PI*(3-Math.sqrt(5))*i;return {...f,x:Math.cos(t)*r,y:Math.sin(t)*r,z}});const groups=[...new Set(nodes.map(f=>group(f.name)))].sort(),centers=new Map(groups.map((g,i)=>{const a=2*Math.PI*(i+.5)/groups.length,h=i%2?1:-1;return [g,{x:h*(.28+.32*rnd(hash(g))),y:Math.sin(a)*.52,z:Math.cos(a)*.48}]}));return nodes.map(f=>{const seed=hash(f.name),c=centers.get(group(f.name)),a=2*Math.PI*rnd(seed),b=2*Math.PI*rnd(seed+17),r=.10+.36*Math.sqrt(rnd(seed+31));return {...f,x:c.x+Math.cos(a)*Math.sin(b)*r,y:c.y+Math.sin(a)*Math.sin(b)*r,z:c.z+Math.cos(b)*r*.8}})}
function project(n,w,h){const cy=Math.cos(angleY),sy=Math.sin(angleY),cx=Math.cos(angleX),sx=Math.sin(angleX),x=n.x*cy-n.z*sy,z=n.x*sy+n.z*cy,y=n.y*cx-z*sx,d=n.y*sx+z*cx,perspective=1/(2.3-d);return{x:w/2+panX+x*perspective*zoom*Math.min(w,h)*.9,y:h/2+panY+y*perspective*zoom*Math.min(w,h)*.9,r:Math.max(2,Math.min(9,2.5+Math.log1p(n.degree)*.8))*perspective*1.5,d}}
function draw(){const ratio=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*ratio;canvas.height=h*ratio;ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,w,h);const nodes=layout(visible()),map=new Map(nodes.map(n=>[n.name,n]));plotted=nodes.map(n=>({file:n,p:project(n,w,h)}));document.getElementById('count').textContent=`Showing ${nodes.length.toLocaleString()} of ${files.size.toLocaleString()} indexed files · ${(graph.symbol_count||symbolById.size).toLocaleString()} indexed symbols · ${graph.links.length.toLocaleString()} links`;
 if(layoutMode==='brain')for(const n of nodes.filter((_,i)=>i%5===0)){const p=project(n,w,h),glow=ctx.createRadialGradient(p.x,p.y,2,p.x,p.y,65*zoom);glow.addColorStop(0,'#5279d122');glow.addColorStop(1,'#5279d100');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(p.x,p.y,65*zoom,0,Math.PI*2);ctx.fill()}
 let drawn=0;const active=selected?related(selected):null;for(const edge of edges.values()){if(!edge.hierarchy&&drawn>=1800)continue;const a=map.get(edge.a),b=map.get(edge.b);if(!a||!b)continue;const p=project(a,w,h),q=project(b,w,h),highlight=active&&active.has(edge.a)&&active.has(edge.b);ctx.lineWidth=highlight?1.7:edge.hierarchy?1.1:.6;ctx.strokeStyle=highlight?'#a8e9ffcc':edge.hierarchy?'#789bc088':'#45608066';ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();if(!edge.hierarchy)drawn++}
 for(const {file,p} of plotted.sort((a,b)=>a.p.d-b.p.d)){ctx.beginPath();ctx.arc(p.x,p.y,file.name===selected?.name?p.r+3:p.r,0,Math.PI*2);ctx.fillStyle=active&&!active.has(file.name)?'#64738c66':color(file.name);ctx.fill();if(file.name===selected?.name){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}if(file.name==='@workspace'||file.name.endsWith('/@module')){ctx.fillStyle='#d8e9fc';ctx.font='11px system-ui';ctx.fillText(file.name==='@workspace'?'Workspace':file.name.split('/')[0],p.x+8,p.y-6)}}}
const row=(label,action,sub)=>{const b=make('button','row',label);b.type='button';b.onclick=action;if(sub)b.append(make('small','',` · ${sub}`));return b};
function relationSection(title,items){details.append(make('h3','',`${title} (${items.length})`));if(!items.length){details.append(make('p','empty','No extracted relationship in this index.'));return}for(const x of items.slice(0,45)){const f=files.get(x.name);details.append(row(x.name.split('/').pop()||x.name,()=>setSelected(f),`${x.relation}${x.count>1?' ×'+x.count:''} · ${x.name}`))}if(items.length>45)details.append(make('p','meta',`${items.length-45} more relationships; search to narrow.`))}
function symbolSection(title,items){details.append(make('h3','',`${title} (${items.length})`));if(!items.length){details.append(make('p','empty','No extracted relationship in this index.'));return}for(const x of items.slice(0,45)){const s=symbolById.get(x.id);if(s)details.append(row(s.label||s.id,()=>setSymbol(s),`${x.relation} · ${s.file} ${s.source_location||''}`))}}
function setSymbol(s){selected=files.get(s.file);selectedSymbol=s;heading.textContent=s.label||s.id;details.replaceChildren();details.append(make('p','path',`${s.file}${s.source_location?' · '+s.source_location:''}`));details.append(make('span','badge',s.class?'Class':s.callable?'Callable':'Symbol'));details.append(make('p','',`Extracted code symbol in ${s.file.split('/').pop()}. Relationships below are directed Graphify links, not a prose explanation of behavior.`));details.append(row('← Back to file',()=>setSelected(selected)));symbolSection('Uses or references',symbolOut.get(s.id)||[]);symbolSection('Used or referenced by',symbolIn.get(s.id)||[]);draw()}
function setSelected(f){if(!f)return;selected=f;selectedSymbol=null;heading.textContent=f.name==='@workspace'?'Workspace':f.name.endsWith('/@module')?f.name.split('/')[0]:f.name.split('/').pop();details.replaceChildren();details.append(make('p','path',f.name));const hub=f.name==='@workspace'||f.name.endsWith('/@module');details.append(make('span','badge',f.name==='@workspace'?'Workspace':hub?'Repository':'Source file'));details.append(make('span','badge',`${f.symbols.length} symbols`));const names=f.symbols.filter(s=>s.label).slice(0,6).map(s=>s.label);details.append(make('p','',hub?'Membership links show the repositories or files in this workspace.':`Contains ${f.symbols.length} indexed symbols${names.length?': '+names.join(', ')+(f.symbols.length>names.length?'…':''):'.'} Relationships below are extracted from code.`));if(!hub&&graph.previews?.[f.name]){details.append(make('h3','','Source preview'));details.append(make('pre','',graph.previews[f.name]))}const out=fileOut.get(f.name)||[],incoming=fileIn.get(f.name)||[];relationSection(hub?'Contains':'Uses or references',out.filter(x=>hub?x.hierarchy:!x.hierarchy));relationSection(hub?'Contained by':'Used or referenced by',incoming.filter(x=>hub?x.hierarchy:!x.hierarchy));details.append(make('h3','','Symbols and source locations'));for(const s of f.symbols.slice(0,100))details.append(row(s.label||s.id,()=>setSymbol({...s,file:f.name}),s.source_location||''));if(f.symbols.length>100)details.append(make('p','meta',`${f.symbols.length-100} more symbols; search by name.`));draw()}
function searchResults(){const q=search.value.trim().toLowerCase();results.replaceChildren();if(!q){if(!selected){heading.textContent='Explore the code';details.replaceChildren(make('p','',"Select a node or search for a file or symbol. Relationships come from Graphify's extracted code index; repository hub links show workspace membership."))}draw();return}const hits=ranked.filter(f=>f.name.toLowerCase().includes(q)||f.symbols.some(s=>(s.label||'').toLowerCase().includes(q)));results.append(make('h3','',`Search results (${hits.length} indexed files)`));for(const f of hits.slice(0,200)){const matching=f.symbols.filter(s=>(s.label||'').toLowerCase().includes(q));results.append(row(f.name,()=>setSelected(f),`${matching.length} matching symbols`));for(const s of matching.slice(0,12))results.append(row('↳ '+(s.label||s.id),()=>setSymbol({...s,file:f.name}),s.source_location||''))}if(hits.length>200)results.append(make('p','meta',`${hits.length-200} more files; refine search.`));if(!selected){heading.textContent='Explore the code';details.replaceChildren(make('p','',`Select one of the matching files or symbols to inspect its relationships.`))}draw()}
function hitAt(x,y){return plotted.map(o=>({o,d:(o.p.x-x)**2+(o.p.y-y)**2})).sort((a,b)=>a.d-b.d)[0]}
canvas.addEventListener('pointerdown',e=>{drag=true;moved=false;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(drag){const dx=e.clientX-lastX,dy=e.clientY-lastY;moved||=Math.abs(dx)+Math.abs(dy)>2;if(e.shiftKey||e.buttons===2){panX+=dx;panY+=dy}else{angleY+=dx*.006;angleX+=dy*.006}lastX=e.clientX;lastY=e.clientY;draw();return}const rect=canvas.getBoundingClientRect(),hit=hitAt(e.clientX-rect.left,e.clientY-rect.top);if(hit&&hit.d<220){hover.style.display='block';hover.style.left=Math.min(e.clientX-rect.left+12,rect.width-200)+'px';hover.style.top=e.clientY-rect.top+12+'px';hover.textContent=hit.o.file.name}else hover.style.display='none'});
canvas.addEventListener('pointerup',e=>{drag=false;canvas.releasePointerCapture(e.pointerId);if(!moved){const rect=canvas.getBoundingClientRect(),hit=hitAt(e.clientX-rect.left,e.clientY-rect.top);if(hit&&hit.d<220)setSelected(files.get(hit.o.file.name))}});
canvas.addEventListener('pointerleave',()=>hover.style.display='none');canvas.addEventListener('contextmenu',e=>e.preventDefault());
const setZoom=value=>{zoom=Math.max(.4,Math.min(4,value));document.getElementById('zoom').value=zoom;draw()};
canvas.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom*(e.deltaY>0?.9:1.1))},{passive:false});
document.getElementById('zoom').addEventListener('input',e=>setZoom(Number(e.target.value)));document.getElementById('zoom-in').onclick=()=>setZoom(zoom*1.2);document.getElementById('zoom-out').onclick=()=>setZoom(zoom/1.2);
document.getElementById('reset').onclick=()=>{angleX=.25;angleY=.1;panX=0;panY=0;setZoom(1)};
document.getElementById('focus').onclick=e=>{focusMode=!focusMode;e.currentTarget.setAttribute('aria-pressed',String(focusMode));draw()};
document.getElementById('mode').onclick=e=>{layoutMode=layoutMode==='brain'?'sphere':'brain';e.currentTarget.textContent=layoutMode==='brain'?'Brain cloud':'Thought sphere';draw()};
canvas.addEventListener('keydown',e=>{if(e.key==='+'||e.key==='=')setZoom(zoom*1.2);else if(e.key==='-')setZoom(zoom/1.2);else if(e.key==='0')document.getElementById('reset').click();else if(e.key==='ArrowLeft')angleY-=.1;else if(e.key==='ArrowRight')angleY+=.1;else if(e.key==='ArrowUp')angleX-=.1;else if(e.key==='ArrowDown')angleX+=.1;else return;e.preventDefault();draw()});
search.addEventListener('input',searchResults);addEventListener('resize',draw);draw();
</script>
</html>
