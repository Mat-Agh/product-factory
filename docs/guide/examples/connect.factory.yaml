# Product Factory descriptor for the Daria Connect workspace ($HOME/Work/Connect).
# Copy to ~/Work/Connect/.factory/factory.yaml after `pf install project ~/Work/Connect`,
# then check every `# verify` line against the live repos. See docs/guide/07-workspace-connect.md.

factory:
  version: 1
  source: https://github.com/Mat-Agh/product-factory

product:
  name: Daria Connect
  one_liner: Self-hosted team communication for organisations, with a vendor Federation plane.   # verify
  locales: [en, fa]
  themes: [dark, light]

layout: multi-repo
workspace_root: .                 # the GitHub workspace; it holds gitlinks only, never product code

modules:
  - area: product
    path: Daria-Connect-Product
    owner_role: product-manager   # PRDs, packets, business docs; no runtime code
    agents_md: AGENTS.md
    gates: see AGENTS.md
    tests: no
  - area: frontend
    path: Daria-Connect-Front-End
    owner_role: engineer          # customer Dashboard + vendor Federation Dashboard
    agents_md: AGENTS.md
    gates: see AGENTS.md (Quality gate)
    tests: yes                    # verify
  - area: backend
    path: Daria-Connect-Back-End
    owner_role: engineer          # customer self-hosted services and installer
    agents_md: AGENTS.md
    gates: see AGENTS.md (Required review gate)
    tests: no                     # no-unit/in-process-test policy
  - area: client
    path: Daria-Connect
    owner_role: engineer          # Android/KMP member client; call it Client, never Frontend
    agents_md: AGENTS.md
    gates: see AGENTS.md
    tests: yes                    # verify
  - area: federation
    path: Daria-Connect-Federation
    owner_role: engineer          # vendor Registry, OAuth, Administration; never shipped to customers
    agents_md: AGENTS.md
    gates: see AGENTS.md (Quality gate)
    tests: no                     # no-unit/in-process-test policy

vcs:
  host: gitlab                    # gitrnd.dariarnd.ir; glab must be logged in to that host
  remote: origin
  base_branch: develop            # factory MRs target each child's develop; humans approve and merge
  branch_prefix: factory/
  open_pr: true
  human_merge: true
  attribution: none               # workspace AGENTS.md forbids naming AI tools in commits and MRs

docs:
  root: docs                      # Front-End uses doc/: run `pf docs-map --docs doc` there
  prd_dir: docs/product           # verify against Daria-Connect-Product's layout
  adr_dir: docs/decisions
  design_dir: docs/design
  changelog: CHANGELOG.md
  index: docs/README.md

design:
  source: figma:7dFw79xlDSW27YSsFosBaO
  require_source: true            # designer stops when a frame is missing; never invents pixels

surfaces:
  ui:
    dev_command: see AGENTS.md
    port_base: 5100
    browser_tool: agent-browser
  api:
    contract: none                # each service's OpenAPI lives in its module docs

acceptance:
  ledger: none                    # verify: Product's delivery ledger, if one is used
  gates: []

risk:
  escalate_paths:
    - "**/.gitlab-ci.yml"
    - "**/installer/**"
    - "**/deploy/**"
    - "**/docker-compose*.yml"
    - "**/migrations/**"
    - "**/db/migration/**"
    - "**/security/**"
    - "**/auth/**"
    - "**/*.lock"
    - "**/gradle/libs.versions.toml"
    - ".secrets/**"

release:
  drafts_dir: docs/launch
  store_listing: none

limits:
  max_resumes: 2
  max_parallel_jobs: 3

models:
  deep: opus
  build: sonnet
