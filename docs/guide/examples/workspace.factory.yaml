# pf: draft descriptor (review with factory init/adopt)
# Example Product Factory descriptor for an independent-checkout workspace.
# Copy to ~/Work/MyWorkspace/.factory/factory.yaml after `pf install project ~/Work/MyWorkspace`,
# then check every `# verify` line against the live repos. See docs/guide/07-multi-repo-workspaces.md.

factory:
  version: 1
  source: https://github.com/Mat-Agh/product-factory

product:
  name: Example Workspace
  one_liner: Example product with web, service, mobile and planning modules.   # verify
  locales: [en, fa]
  themes: [dark, light]

layout: multi-repo
workspace_root: .                 # the GitHub workspace; it holds gitlinks only, never product code

modules:
  - area: product
    path: planning
    stack: product-docs
    docs_root: product            # The handbook is separately rooted at development/
    docs: { prd_dir: product/requirements, adr_dir: product/decisions, design_dir: design }
    owner_role: product-manager   # PRDs, packets, business docs; no runtime code
    agents_md: AGENTS.md
    gates: see AGENTS.md
    tests: no
  - area: frontend
    path: web
    stack: typescript-web
    docs_root: doc
    owner_role: engineer
    agents_md: AGENTS.md
    gates: see AGENTS.md (Quality gate)
    tests: yes                    # verify
  - area: backend
    path: api
    stack: spring-kotlin-service
    docs_root: docs
    owner_role: engineer
    agents_md: AGENTS.md
    gates: see AGENTS.md (Required review gate)
    tests: no                     # example project policy
  - area: client
    path: mobile
    stack: kmp-android-client
    docs_root: docs
    owner_role: engineer
    agents_md: AGENTS.md
    gates: see AGENTS.md
    tests: yes                    # verify

vcs:
  host: gitlab
  remote: origin
  base_branch: develop            # factory MRs target each child's develop; humans approve and merge
  branch_template: "{kind}/{job-id}"   # example GitFlow naming
  branch_kinds: { feature: feature, bug: fix, design: feature, docs: docs, chore: chore, spike: docs, idea: docs, release: chore }
  commit_convention: conventional   # ciValidateGitConventions: type(scope)!: lowercase subject
  open_pr: true
  human_merge: true
  attribution: none               # workspace AGENTS.md forbids naming AI tools in commits and MRs

docs:
  root: docs                      # Front-End uses doc/: run `pf docs-map --docs doc` there
  prd_dir: docs/prd               # verify in the owning software checkout before writing
  adr_dir: docs/decisions
  design_dir: docs/design
  changelog: CHANGELOG.md
  index: docs/README.md

design:
  source: repo
  require_source: false            # designer stops when a frame is missing; never invents pixels

surfaces:
  ui:
    dev_command: see AGENTS.md
    port_base: 5100
    browser_tool: agent-browser
  api:
    contract: none                # each service's OpenAPI lives in its module docs

acceptance:
  ledger: none                    # verify: Product's delivery ledger, if one is used
  gates: []

risk:
  escalate_paths:
    - "**/.gitlab-ci.yml"
    - "**/installer/**"
    - "**/deploy/**"
    - "**/docker-compose*.yml"
    - "**/migrations/**"
    - "**/db/migration/**"
    - "**/security/**"
    - "**/auth/**"
    - "**/*.lock"
    - "**/gradle/libs.versions.toml"
    - ".secrets/**"

release:
  drafts_dir: docs/launch
  store_listing: none

limits:
  max_resumes: 2
  max_parallel_jobs: 3

models:
  deep: opus
  build: sonnet
